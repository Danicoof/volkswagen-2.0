name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main        # Prod
      - development # QA
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-backend.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Determinar entorno y variables según la rama
      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "GCP_PROJECT_ID=vw-arg" >> $GITHUB_ENV
            echo "SERVICE_NAME=vw-backend-prod" >> $GITHUB_ENV
          else
            echo "ENV_NAME=development" >> $GITHUB_ENV
            echo "GCP_PROJECT_ID=dev-vw-arg" >> $GITHUB_ENV
            echo "SERVICE_NAME=vw-backend-qa" >> $GITHUB_ENV
          fi

      # Autenticación con Google Cloud (Prod o QA según rama)
      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY_PROD || secrets.GCP_SA_KEY_QA }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Authorize Docker push
        run: gcloud auth configure-docker

      - name: Build and Push Container
        run: |
          # Construimos desde el ROOT del monorepo usando el Dockerfile del backend
          docker build -f apps/backend/Dockerfile -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
             NODE_ENV=production
             GCP_PROJECT_ID=${{ env.PROJECT_ID }}
